# Config file

global_vars:
  states: ['IN', 'OH', 'MI', 'IA', 'IL', 'MN', 'WI'] # 'IN', 'OH', 'MI', 'IA', 'IL', 'MN', 'WI'
  states_full_name: ['Indiana', 'Ohio', 'Michigan', 'Iowa', 'Illinois', 'Minnesota', 'Wisconsin'] # 'Indiana', 'Ohio', 'Michigan', 'Iowa', 'Illinois', 'Minnesota', 'Wisconsin'
  states_code: ['18', '39', '26', '19', '17', '27', '55'] # preserve the same order as the "states": IN - 18, OH -  39, MI - 26, IA - 19, IL - 17, MN - 27,  WI - 55
  states_DISES: ['IN', 'OH', 'MI']
  years: [2014, 2025] #2014-2025
  CSB_years: ["1724"]
  target_CRS: "EPSG:5070"

regrow:
  raw_2014_2024_dir: "data/Regrow/2014-2024"
  raw_2025_dir: "data/Regrow/2025"
  raw_dir: "data/Regrow"
  edited_output_dir: "data/edited/Regrow"
  states_monitor: ['OH', 'MN_WI_IA_IN_IL', 'MI']

csb:
  base_html: "https://www.nass.usda.gov/Research_and_Science/Crop-Sequence-Boundaries/datasets"
  raw_dir: "data/CSB"
  output_dir: "data/CSB"
  edited_output_dir: "data/edited/CSB"

DISES:
  raw_dir: data/DISES
  output_dir: data/edited/DISES

regrow_DISES:
  buffer_margin: 0 # how much to shrink (or erode if positive) Regrow polygon inward before overplaying with DISES parcels
  area_match_coefs: [0.75, 1.25]
  edited_output_dir: "data/edited/Regrow"

csb_DISES:
  buffer_margin: 0 # how much to shrink (or erode if positive) CSB polygon inward before overplaying with DISES parcels
  area_match_coefs: [0.75, 1.25]
  edited_output_dir: "data/edited/CSB"

regrow_supplement:
  edited_output_dir: "data/edited/Regrow"

csb_supplement:
  edited_output_dir: "data/edited/CSB"

cdl:
  base_html: "https://www.nass.usda.gov/Research_and_Science/Cropland/Release/datasets"
  raw_dir: "data/CDL"
  output_dir: "data/CDL"
  edited_output_dir: "data/edited/CDL"

elevation:
  base_html: "https://prd-tnm.s3.amazonaws.com/StagedProducts/Elevation/1/TIFF/current"
  y_range: [35, 51] #N36 to N50
  x_range: [81, 100] #W081 to W099
  resampling_method: "bilinear"
  raw_dir: "data/Geo/elevation/tiles"
  output_dir: "data/Geo/elevation"

slope:
  output_dir: "data/Geo/slope"

census_tract: # define census tract file in Snakefile
  base_html: "https://www2.census.gov/geo/tiger/GENZ2023/shp/cb_2023_us_tract_500k.zip"
  raw_dir: "data/Census/census_tract"
  output_dir: "data/Census/census_tract"

state_bound: # define state boundary file in Snakefile
  base_html: "https://www2.census.gov/geo/tiger/GENZ2023/shp/cb_2023_us_state_500k.zip"
  raw_dir: "data/Census/state_bound"
  output_dir: "data/Census/state_bound"

county_bound: # define county boundary file in Snakefile
  base_html: "https://www2.census.gov/geo/tiger/GENZ2023/shp/cb_2023_us_county_500k.zip"
  raw_dir: "data/Census/county_bound"
  output_dir: "data/Census/county_bound"

roads: 
  base_html: "https://www2.census.gov/geo/tiger/TIGER2023/PRISECROADS"
  state_codes: ['17', '18', '19', '26', '27', '39', '55', '21', '29', '31', '38', '42', '46', '54'] # main and neighboring states
  raw_dir: "data/Roads/raw"
  output_dir: "data/Roads"
  edited_output_dir: "data/edited/Roads"

watershed:
  base_html: "https://prd-tnm.s3.amazonaws.com/StagedProducts/Hydrography/NHD/State/Shape"
  raw_dir: "data/Geo/watershed/raw"
  output_dir: "data/Geo/watershed"

weather:
  base_html: "https://data.prism.oregonstate.edu/time_series/us/an/800m"
  weather_variables: ["ppt", "tmax", "tmin", "tmean", "tdmean", "vpdmax", "vpdmin", "soltotal", "solslope"]
  raw_dir: "data/Weather/raw"
  output_dir: "data/Weather"
  edited_output_dir: "data/edited/Weather" 

price:
  N_nearest: 5
  K: 3 # number of nearest elevators considered in the nearest elevator search
  crops: ['corn', 'soybeans', 'wheat']
  levels: ['elevator','county']
  drop_threshold: 12 # drop entries (elevator prices or county price indices) with fewer than "drop_cretirion" monthly observations between 2015 and 2025
  raw_dir: "data/Grain Price"
  output_dir: "data/edited/Grain Price"

soil:
  soil_depth_cm: 30
  raw_dir: "data/gSSURGO"
  output_dir: "data/gSSURGO"
  edited_output_dir: "data/edited/Soil"